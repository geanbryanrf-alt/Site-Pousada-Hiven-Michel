<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotos e Melhores Momentos | Rio Haven Pousada Hostel</title>
  <meta name="description" content="Confira os melhores momentos, a estrutura premium e a experiência única da Rio Haven Pousada Hostel em Camorim.">
  <meta property="og:title" content="Fotos e Melhores Momentos | Rio Haven Pousada Hostel">
  <meta property="og:description" content="Confira os melhores momentos, a estrutura premium e a experiência única da Rio Haven Pousada Hostel em Camorim.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo-rio-haven.png" type="image/png">
</head>
<body>

  <!-- ═══════ HEADER & MENU ═══════ -->
  <app-header></app-header>
  <app-mobile-menu></app-mobile-menu>

  <!-- ═══════ HERO ═══════ -->
  <section class="page-hero">
    <div class="page-hero__bg" style="background:var(--navy)"></div>
    <div class="page-hero__dots"></div>
    <div class="container page-hero__content anim">
      <div class="page-hero__badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Nossa Essência</span>
      </div>
      <h1 class="page-hero__title">Melhores Momentos</h1>
      <p class="page-hero__subtitle">Um pouco da experiência única que espera por você na Rio Haven. Sinta o clima, o conforto e a natureza ao nosso redor.</p>
    </div>
  </section>

  <!-- ═══════ GALERIA ═══════ -->
  <section class="section" id="galeria">
    <div class="container">
      <div class="accom-carousel photo-carousel anim" aria-label="Carrossel de fotos da Rio Haven">
        <button class="accom-carousel__nav accom-carousel__nav--prev" type="button" aria-label="Foto anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="accom-carousel__viewport">
          <div class="accom-carousel__track">
            <button class="accom-carousel__slide active" type="button" data-gallery="fotos" data-index="0">
              <img src="images/momento-1.webp" alt="Foto da Rio Haven 1" loading="lazy">
              <span>Foto 1 de 18</span>
            </button>
            <button class="accom-carousel__slide" type="button" data-gallery="fotos" data-index="1">
              <img src="images/momento-2.webp" alt="Foto da Rio Haven 2" loading="lazy">
              <span>Foto 2 de 18</span>
            </button>
            <button class="accom-carousel__slide" type="button" data-gallery="fotos" data-index="2">
              <img src="images/momento-3.webp" alt="Foto da Rio Haven 3" loading="lazy">
              <span>Foto 3 de 18</span>
            </button>
            <button class="accom-carousel__slide" type="button" data-gallery="fotos" data-index="3">

              <span>Foto 4 de 18</span>
            </button>
            <button class="accom-carousel__slide" type="button" data-gallery="fotos" data-index="4">

              <span>Foto 5 de 18</span>
            </button>
            <button class="accom-carousel__slide" type="button" data-gallery="fotos" data-index="5">
              <img src="images/momento-6.webp" alt="Foto da Rio Haven 6" loading="lazy">
              <span>Foto 6 de 18</span>
            </button>
            <button class="accom-carousel__slide" type="button" data-gallery="fotos" data-index="6">
              <img src="images/momento-7.webp" alt="Foto da Rio Haven 7" loading="lazy">
              <span>Foto 7 de 18</span>
            </button>
            <button class="accom-carousel__slide" type="button" data-gallery="fotos" data-index="7">
              <img src="images/momento-8.webp" alt="Foto da Rio Haven 8" loading="lazy">
              <span>Foto 8 de 18</span>
            </button>
            <button class="accom-carousel__slide" type="button" data-gallery="fotos" data-index="8">

            <button class="accom-carousel__slide" type="button" data-gallery="fotos" data-index="9">

              <span>Foto 15 de 18</span>
            </button>
            <button class="accom-carousel__slide" type="button" data-gallery="fotos" data-index="15">
              <img src="images/momento-16.webp" alt="Foto da Rio Haven 16" loading="lazy">
              <span>Foto 16 de 18</span>
            </button>
            <button class="accom-carousel__slide" type="button" data-gallery="fotos" data-index="16">
              <img src="images/momento-17.webp" alt="Foto da Rio Haven 17" loading="lazy">
              <span>Foto 17 de 18</span>
            </button>
            <button class="accom-carousel__slide" type="button" data-gallery="fotos" data-index="17">
              <img src="images/momento-18.webp" alt="Foto da Rio Haven 18" loading="lazy">

            </button>
          </div>
        </div>
        <button class="accom-carousel__nav accom-carousel__nav--next" type="button" aria-label="Próxima foto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

      </div>
    </div>
